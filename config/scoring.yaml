# How each published statement is scored (`observatoire score`), and what each score
# means. PROVISIONAL GRID (2026-11-10): written the evening before the CTO's review, to be
# validated or changed; the methodology page says so. Changing anything below changes the
# scorer's prompt, hence its version: every statement is scored again.
#
# A score describes a position stated in the quote; it never grades the candidate. The
# model gives, for each scale, the score, one sentence saying why, and the words of the
# quote it rests on; code checks that those words are in the quote, or the score is
# dropped. A scale that does not apply to a statement is left empty (null), never guessed.
#
# The site averages scores per candidate and axis (`aggregation`), and shows how many
# statements each average rests on; below `min_statements`, the cell is marked as thin.
aggregation: mean
min_statements: 3

scales:
  - id: orientation
    label_fr: Encadrer ↔ Accélérer
    label_en: Restrain ↔ Accelerate
    low_fr: Encadrer
    low_en: Restrain
    high_fr: Accélérer
    high_en: Accelerate
    question_en: >-
      Does the statement push to restrain, protect against or slow down AI and what it
      brings (1), or to develop, fund, deploy and free it (5)? 3 is a balanced statement:
      develop with safeguards. Leave it empty when the statement takes no side (a fact, a
      criticism of an opponent, a figure without a stated aim).
    # What 1, 3 and 5 mean on each axis: the model reads the statement against these.
    anchors:
      regulation:
        1: "strict rules, bans, moratoriums, liability, strong oversight"
        3: "targeted rules that let AI develop"
        5: "deregulation, removing rules that hold AI back"
      souverainete:
        1: "limit dependence by restricting foreign AI and data flows, without building capacity"
        3: "protect strategic assets while partnering abroad"
        5: "build national or European AI capacity fast: cloud, compute, chips, champions"
      energie:
        1: "moratorium on data centres, limit AI's energy and water use"
        3: "data centres allowed under environmental conditions"
        5: "power AI at scale: dedicated electricity, nuclear, more data centres"
      emploi:
        1: "protect existing jobs, slow automation, tax or restrict job-replacing AI"
        3: "accompany the transition: retraining, sharing gains"
        5: "embrace automation to raise productivity and create new jobs"
      formation:
        1: "limit or ban AI at school, protect learning from it"
        3: "teach about AI and its limits, framed use"
        5: "train massively in AI, from school to adult reskilling"
      services:
        1: "keep public services human, refuse automated decisions"
        3: "use AI in the state with human control"
        5: "deploy AI widely across the state and health"
      surveillance:
        1: "ban facial recognition and algorithmic policing, protect privacy"
        3: "allow some uses under strict safeguards"
        5: "expand AI surveillance and algorithmic policing"
      defense:
        1: "ban or restrict military AI and autonomous weapons"
        3: "military AI under international rules"
        5: "invest heavily in military AI, drones and cyber"
      securite-modeles:
        1: "pause or strictly control advanced models"
        3: "evaluate and audit models before deployment"
        5: "let advanced models develop, light safety rules"
      financement:
        1: "no or less public money for AI, tax AI firms"
        3: "targeted public support"
        5: "massive public and private investment in AI"

  - id: concreteness
    label_fr: Concrétude
    label_en: Concreteness
    low_fr: Vague
    low_en: Vague
    high_fr: Précise
    high_en: Precise
    question_en: >-
      How concrete is the statement? 1: a general view or value, no measure. 2: a direction
      without a measure ("we must invest in AI"). 3: a named measure without numbers or
      dates ("create a sovereign cloud"). 4: a measure with one figure, a date or an actor
      ("10 billion euros", "by 2030", "a national agency"). 5: a measure with figures and
      dates or a funding plan. Always give a score.
