# What the public register shows (`observatoire register`).
#
# Each passage shows one annotation:
#   1. a cross-verified edition's, listed below in order of precedence, when one covers
#      the passage as it is now; its statements carry the "Vérifiée" badge;
#   2. otherwise the automatic annotator's (LLM_PROVIDER, e.g. Mistral in the daily run):
#      the one covering the most current passages; badge "Contrôles automatiques";
#   3. otherwise the passage is pending: the site says "en attente", never "aucune
#      position identifiée", about text nobody has read.
# An edition is listed here by an editor, once its verification record exists. Listing
# it is what lets it outrank the daily annotator: a morning run never replaces it.
# Retired on 2026-11-09: the edition of 3 November 2026 (annotator
# claude-code-session-draft+classify_dimension.v1@6c8d9c67b81d, record
# annotations/2026-11-03-verification.json: 117 requests annotated offline by an assistant,
# 188 proposals each checked by six automatic verifiers; 6 discarded, 1 axis changed, 45
# statements with corrected notes) classified statements on the nine axes of the
# prototype. The ten-axis taxonomy of 2026-11-09 replaced them: its statements name axes
# that no longer exist, so it can no longer outrank the daily annotator. Its record stays
# in the repository. A new cross-verified edition, on the ten axes, is to be listed here.
verified_editions: []
