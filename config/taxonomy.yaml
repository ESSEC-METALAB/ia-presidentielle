# Dimensions of AI policy, the filter that decides which passages are worth annotating,
# and the gates every annotation must pass. No list or threshold below lives in code.
#
# `version` changes whenever anything below changes. The dimensions are written into the
# prompt, whose hash is part of the annotator's version: changing one re-annotates. The
# prefilter and the gates are not: a change applies to new annotations, and
# `observatoire annotate --rebuild` re-applies it to stored ones (free when replaying a
# recorded batch).
version: "2026-11-09"

# The ten axes of the public register. Each annotation is attached to exactly one: the
# main object of the sentence. The nine axes of the site prototype ("IA 2027 — Registre",
# v3) were revised on 2026-11-09 after the 5 November demonstration: "Environnement &
# ressources" became "Énergie", and "Sécurité & défense" was split into "IA de défense"
# and "Sécurité des modèles". The definitions carry the boundary rules (energy,
# surveillance/defence, defence/model security, training).
# Descriptive, never normative: an axis names a subject, not a direction.
dimensions:
  - id: regulation
    label_fr: Régulation
    label_en: Regulation
    definition_fr: Règles, interdictions, contrôle, responsabilité, ou une position de dérégulation assumée.
    definition_en: Rules, bans, oversight, liability, or an explicit deregulation stance.
  - id: souverainete
    label_fr: Souveraineté & infra
    label_en: Sovereignty & infra
    definition_fr: >-
      Cloud souverain, capacité de calcul, puces, données, dépendance aux fournisseurs
      étrangers. L'électricité et le nucléaire au service de l'IA relèvent de l'énergie,
      même présentés comme un atout national.
    definition_en: >-
      Sovereign cloud, compute, chips, data, dependence on foreign providers. Electricity
      and nuclear power for AI belong to energy, even when framed as a national asset.
  - id: energie
    label_fr: Énergie
    label_en: Energy
    definition_fr: >-
      L'énergie et les ressources de l'IA : électricité et nucléaire pour le calcul,
      réseau, consommation d'électricité et d'eau des centres de données, récupération de
      chaleur, implantation, empreinte carbone.
    definition_en: >-
      Energy and resources for AI: electricity and nuclear power for compute, the grid,
      electricity and water use of data centres, waste-heat recovery, siting, carbon
      footprint.
  - id: emploi
    label_fr: Emploi
    label_en: Jobs
    definition_fr: Emplois créés ou supprimés, automatisation, droit du travail, protection des métiers exposés.
    definition_en: Jobs created or displaced, automation, labour law, protection for exposed occupations.
  - id: formation
    label_fr: Éducation & formation
    label_en: Education & training
    definition_fr: >-
      École, université, filière d'ingénieurs, formation continue et reconversion. Une
      mesure délivrée sous forme de formation relève d'ici même si son but est de
      protéger l'emploi.
    definition_en: >-
      Schools, universities, the engineer pipeline, continuing training and
      reconversion. A measure delivered as training belongs here even when its purpose
      is protecting jobs.
  - id: services
    label_fr: Services publics
    label_en: Public services
    definition_fr: IA dans l'État, l'administration, la santé, la détection de fraude.
    definition_en: AI inside the state, administration, healthcare, fraud detection.
  - id: surveillance
    label_fr: Surveillance & libertés
    label_en: Surveillance & liberties
    definition_fr: >-
      Reconnaissance faciale, police, décisions algorithmiques, vie privée. L'IA tournée
      vers la population ; défendre le pays ou ses systèmes contre une attaque relève de
      la défense.
    definition_en: >-
      Facial recognition, policing, algorithmic decisions, privacy. AI turned on the
      population; defending the country or its systems from attack is defence.
  - id: defense
    label_fr: IA de défense
    label_en: AI for defence
    definition_fr: >-
      L'IA au service de la défense et de la sécurité nationale : armées, drones et
      systèmes d'armes autonomes, renseignement, cyberdéfense, protection des
      infrastructures critiques, ingérences étrangères et désinformation.
    definition_en: >-
      AI for defence and national security: the armed forces, drones and autonomous
      weapons, intelligence, cyberdefence, critical-infrastructure protection, foreign
      interference and disinformation.
  - id: securite-modeles
    label_fr: Sécurité des modèles
    label_en: Model security
    definition_fr: >-
      La sûreté et la sécurité des systèmes d'IA eux-mêmes : robustesse, attaques contre
      les modèles, évaluation et audit des modèles avancés, risques des IA les plus
      puissantes. Les règles d'étiquetage des contenus générés relèvent de la régulation.
    definition_en: >-
      The safety and security of AI systems themselves: robustness, attacks on models,
      evaluation and auditing of advanced models, risks of the most capable AI. Labelling
      rules for generated content are regulation.
  - id: financement
    label_fr: Financement
    label_en: Funding
    definition_fr: Investissement public et privé, fiscalité, commande publique, budgets.
    definition_en: Public and private investment, tax, procurement, budgets.

# Which passages are sent to the annotator. Measured in the previous version (branch
# `daily`, observatoire/transcript.py): a flat keyword list passed a pensions debate on
# "c'est des calculs" and a tax debate on one stray "données". One strong pattern is
# enough; weak patterns need at least `weak_min_distinct` different matches.
# Python regular expressions, matched case-insensitively.
relevance:
  strong_patterns:
    - 'intelligence\s+artificielle'
    - '\bIA\b'
    - 'algorithm'
    - 'machine\s+learning'
    - 'apprentissage\s+automatique'
    - '\bLLM\b'
    - 'chatgpt'
    - 'openai'
    - 'anthropic'
    - 'mistral'
    - 'data\s*-?\s*cent'
    - 'centres?\s+de\s+donn[ée]es'
    - 'souverainet[ée]\s+num[ée]rique'
    - '(?:puissance|capacit[ée]s?)\s+de\s+calcul'
    - 'deepfake'
    - 'hypertrucage'
    - 'reconnaissance\s+faciale'
    - 'AI\s+Act'
  weak_patterns:
    - '\bnum[ée]rique'
    - '\bdonn[ée]es'
    - 'automatisation'
    - '\brobot'
    - '\bcloud\b'
    - 'technologi'
  weak_min_distinct: 2

# Gates applied to every proposed annotation. A failed gate rejects the annotation and
# records why; nothing is corrected silently.
gates:
  # The quote must be one exact passage of the segment, short enough to be a citation.
  quote_max_words: 60
  # Judgement words, checked in the summaries and context notes ONLY, never in the
  # quote or its gloss: if a candidate calls their own plan ambitious, that is their word
  # and it is evidence. Stems, matched at a word start, case-insensitively, from the
  # previous version (observatoire/lint.py). One list per language, each checked in its
  # own fields only: "sensible" judges in English but means "sensitive" in French
  # ("données sensibles"), and a single list rejected seven faithful French notes.
  evaluative_stems_fr:
    - ambitieu
    - audacieu
    - timide
    - flou
    - vague
    - irréaliste
    - réaliste
    - crédible
    - incohérent
    - insuffisant
    - excessi
    - modeste
    - prometteu
    - décevant
    - révolutionnaire
    - visionnaire
    - pertinent
    - dangereu
    - remarquable
    - impressionnant
    - intéressant
    - courageu
    - raisonnable
  evaluative_stems_en:
    - ambitious
    - bold
    - timid
    - unrealistic
    - realistic
    - credible
    - incoherent
    - insufficient
    - excessive
    - modest
    - promising
    - disappointing
    - revolutionary
    - visionary
    - relevant
    - dangerous
    - remarkable
    - impressive
    - interesting
    - courageous
    - reasonable
    - sensible
