# Official sources of the candidates' words, each with its trust level (README,
# "Niveaux de source"): 1 = the person's own words, 2 = party or campaign team.
# A source's level is a conservative default, confirmed by an editor at review, except
# where the source itself names the speaker (`trust_confirmed: true`: the Assemblée
# nationale record).
#
# Every URL below comes from the previous version (branch `daily`): each was probed on
# 2026-09-18 and returned items, and that version's daily run on GitHub Actions read every
# non-archive source again on 2026-10-04. Nothing is listed on the strength of a plausible
# URL. A new entry is fetched, checked against robots.txt and confirmed to extract before
# it is added.
#
# kind selects the reader: rss, page, pdf, assemblee_nationale, transcript. `sitemap` sources are
# one-off archive crawls whose reader is not written yet: enabled: false, so only
# `observatoire import-legacy` fills them, from what the previous version collected.

# The period the corpus covers. Texts published before this date are neither collected
# nor imported; texts without a date are kept and shown as "date non précisée", since a
# missing date is not evidence of age. Moving it forward leaves older texts stored but
# out of scope: they are counted on the corpus page, never silently dropped.
# Social media accounts (kind: social), read through Apify scrapers: the platforms
# offer no affordable official access (decided on 2026-11-09). Each actor was tried on
# 2026-11-09 on real accounts before being chosen (src/observatoire/adapters/sources/
# social_reader.py names them). Only posts the account wrote are kept: no reposts, and
# never anyone's comments. A post on a candidate's own account is level 1 by default, not
# confirmed: a campaign team often writes it.
social:
  lookback_days: 2
  daily_max_items: 5
  max_charge_usd: 0.5   # Apify's minimum cap for some actors
  timeout_seconds: 280
  min_hours_between_reads: 20
  # Matched against the title and the start of the description.
  youtube_skip_titles:
    - "\\binterview"
    - "\\bentretien"
    - "\\binvit[ée]"
    - "\\bmatinale"
    - "\\bface [àa]\\b"
    - "\\bd[ée]bat"
    - "\\bgrand jury"
    - "\\bquestions?\\b"
    - "\\bsur (bfm|lci|cnews|rtl|tf1|france ?(2|3|5|inter|info|culture)|franceinfo|europe ?1|sud radio|rmc|politico|c8|lcp|public s[ée]nat)"

collection:
  since: 2026-07-01
  # The same URL read again can extract slightly differently (another PDF library, one
  # more space): from this share of shared five-word sequences with a stored version, it
  # is the same text, not a new one. Measured on 2026-11-04: the Retailleau programme PDF
  # extracted twice scores 0.996; a lafranceinsoumise.fr article edited after publication
  # 0.92 (kept as a new version: an added sentence may be the one about AI); a
  # rewritten page below 0.5.
  near_duplicate_similarity: 0.95

crawler:
  user_agent: "ESSECMetalabBot/1.0 (+https://metalab.essec.edu)"
  min_delay_seconds: 1.0
  timeout_seconds: 60
  min_text_chars: 400       # below this, a page is a teaser, not a text
  max_redirects: 5

