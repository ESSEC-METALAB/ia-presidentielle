# Candidate registry: the only place a candidate exists (CLAUDE.md §8 — never in Python).
#
# Who is shown (decided on 2026-11-06, after the 5 November demonstration; docs/
# methodology.md, "Candidats"): the thirteen people with the best first-round score in
# a poll with fieldwork ending on or after 2026-07-01, among those tested in at least
# five such polls (MieuxVoter dataset, checked on 2026-11-09: 13th Fabien Roussel 4.5 %,
# then Dominique de Villepin 4.3 % and Nicolas Dupont-Aignan 4 %; Bruno Le Maire, 6 %,
# was tested in two polls only). Being shown is an editorial choice, written as `shown`;
# the candidacy is a fact, and the site states it when the person is not running
# (Olivier Faure, withdrawn; François Hollande, prospective: not declared, tested in
# polls). A person who is declared but not on the list stays configured with
# `shown: false`: their stored texts are kept, never shown, and their sources are off.
#
# Previous rule, applied on 2026-10-14, which made up the configuration. A person was
# added when they
#   (a) have publicly declared a candidacy for the 2027 presidential election, or been
#       designated by their party or a primary, and have not withdrawn; and
#   (b) either their party has a parliamentary group in the Assemblée nationale or the
#       Sénat, or they were credited with at least 2 % of first-round voting intentions
#       in a poll with fieldwork ending on or after 2026-07-01.
# The seven people inherited from the previous version are kept. Those no longer running
# are marked `withdrawn`, not removed: removing a person is an editorial decision.
#
# Each `candidacy` records the public sources that establish it. Polls come from the
# MieuxVoter dataset (github.com/MieuxVoter/presidentielle2027, state of 2026-10-13),
# which cites each poll's Commission des sondages notice. News pages could not be opened
# from this environment: statuses rest on search-result summaries of the sources listed,
# and every entry is to be re-read against those pages before anything is published.
#
# Order: alphabetical by surname.
#
# party_short: shown next to the name on the register. family_name: only where the last
# word of `name` is not the surname, for alphabetical order.
#
# aliases: matched whole-word and case-insensitively. Unambiguous forms only: "Olivier
# Faure", never "Faure"; "Fabien Roussel", never "Roussel"; "Nathalie Arthaud", never
# "Arthaud".
candidates:
