# Candidate registry: the only place a candidate exists (CLAUDE.md §8 — never in Python).
#
# Roster inherited from the previous version (branch `daily`, sources.yaml). The POC's
# five-candidate scope is still an editorial decision; until it is made, every inherited
# person is collected, so nobody is dropped by default.
#
# aliases: matched whole-word and case-insensitively, to show whether a document names
# its candidate. Unambiguous forms only: "Olivier Faure", never "Faure"; "Marine Le Pen",
# never "Le Pen"; "Édouard Philippe", never "Philippe".
candidates:
  - id: bruno-retailleau
    name: Bruno Retailleau
    party: LR
    aliases: [Retailleau]

  - id: jean-luc-melenchon
    name: Jean-Luc Mélenchon
    party: LFI
    aliases: [Mélenchon, Melenchon]

  - id: olivier-faure
    name: Olivier Faure
    party: PS
    aliases: [Olivier Faure]

  - id: gabriel-attal
    name: Gabriel Attal
    party: Renaissance
    aliases: [Attal]

  - id: edouard-philippe
    name: Édouard Philippe
    party: Horizons
    aliases: [Édouard Philippe, Edouard Philippe]

  - id: marine-le-pen
    name: Marine Le Pen
    party: RN
    aliases: [Marine Le Pen]

  - id: jordan-bardella
    name: Jordan Bardella
    party: RN
    aliases: [Bardella]
