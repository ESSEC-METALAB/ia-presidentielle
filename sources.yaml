# Every entry here was probed on 2026-09-18 and returned items. Nothing is
# listed on the strength of a plausible URL.
#
# tier — whose words, not who hosts:
#   "1" the person's own words      → document
#   "2" party or staff for them     → document
#   "3" press reporting on them     → lead (a question for the editor)
#
# speakers — required on video. Auto-captions carry no speaker labels, so on a
# press conference or hearing a journalist's question is indistinguishable from
# the candidate's answer. Channels default to `multi`; use `single` only for a
# specific speech or conference talk added by hand.

people:
  - slug: bruno-retailleau
    name: Bruno Retailleau
    party: LR
    match: [Retailleau]
    sources:
      # 56 pages, 104,883 chars, 14 mentions of "intelligence artificielle".
      # Worth more than all 45 party-feed documents combined.
      - {type: pdf, url: "https://republicains.fr/wp-content/uploads/2026/07/LR_IA.pdf",
         tier: "1", date: "2026-07-07",
         label: "L'IA au service des Français — progrès, souveraineté, vigilance"}
      - {type: rss, url: "https://republicains.fr/feed/", tier: "2", max: 15}
      # one-off archive backfill; RSS carries the delta
      - {type: site, url: "https://republicains.fr", tier: "2", max: 500}
      - {type: youtube, channel: "https://www.youtube.com/@lesrepublicains/videos",
         tier: "2", speakers: multi, label: "Les Républicains", max: 5}

  - slug: jean-luc-melenchon
    name: Jean-Luc Mélenchon
    party: LFI
    match: [Mélenchon, Melenchon]
    sources:
      - {type: rss, url: "https://lafranceinsoumise.fr/feed/", tier: "2", max: 15}
      # one-off archive backfill; RSS carries the delta
      - {type: site, url: "https://lafranceinsoumise.fr", tier: "2", max: 500}

  - slug: olivier-faure
    name: Olivier Faure
    party: PS
    match: ["Olivier Faure"]          # "Faure" alone is a common surname
    sources:
      - {type: rss, url: "https://parti-socialiste.fr/feed/", tier: "2", max: 15}
      # one-off archive backfill; RSS carries the delta
      - {type: site, url: "https://parti-socialiste.fr", tier: "2", max: 500}

  # Declared candidates with no verified own-feed yet. They are still tracked:
  # the shared press feeds below attribute by name match.
  - slug: gabriel-attal
    name: Gabriel Attal
    party: Renaissance
    match: [Attal]
    sources: []

  - slug: edouard-philippe
    name: Édouard Philippe
    party: Horizons
    match: ["Édouard Philippe", "Edouard Philippe"]   # "Philippe" alone is a first name
    sources:
      # No feed on his site; a standing priorities page, re-read each run.
      - {type: page, url: "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-conquerante",
         tier: "1", label: "Pour une France plus conquérante — priorités"}

  - slug: marine-le-pen
    name: Marine Le Pen
    party: RN
    match: ["Marine Le Pen"]          # bare "Le Pen" is ambiguous
    sources: []

  - slug: jordan-bardella
    name: Jordan Bardella
    party: RN
    match: [Bardella]
    sources: []

# Fetched once, then attributed to whichever people they name. Specialist tech
# press: open, extractable, and the outlets that actually cover AI policy.
shared:
  - {type: rss, url: "https://next.ink/feed/",            tier: "3", max: 25, label: "Next"}
  - {type: rss, url: "https://synthmedia.fr/feed/",       tier: "3", max: 15, label: "Synthmedia"}
# Removed 2026-09-18 — both disallow this crawler in robots.txt, so bodies are
# unfetchable, and their headlines alone almost never name a candidate:
#   numerama.com          robots.txt: disallowed
#   usine-digitale.fr     robots.txt: disallowed
# Do not re-add without checking robots.txt first.
