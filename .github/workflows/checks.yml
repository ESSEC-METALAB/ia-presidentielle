# The gate that actually blocks a merge.
#
# The daily workflow runs the same checks, but it runs on a schedule, so its
# result attaches to the scheduled run and not to the review branch's head
# commit — a pull request opened from it carries no status at all. Requiring
# the gates on a merge therefore needs them to run on the pull request itself,
# which is what this does.
#
# No secrets and no network: this reads what the branch already contains.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # yt-dlp is deliberately absent: nothing here fetches.
      - name: Install
        run: uv sync --frozen --all-extras --group dev

      - name: Tests
        run: uv run python -m pytest -q

      # Every published claim carries a verbatim quote that exists in its
      # source, a dated Wayback capture, and prose that describes rather than
      # judges. Any finding fails this job.
      - name: Quality gates
        run: uv run python -m observatoire.lint

      # The grid must render a cell for every person on every axis. A missing
      # cell is asymmetric coverage, which for an institution during an
      # election is the risk the whole design exists to answer.
      - name: Render
        run: uv run python -m observatoire.render
