# The morning pass. Fetches, extracts, gates, and opens the pull request that
# is the editorial review — see docs/superpowers/specs §8.
#
# Nothing here deploys. Vercel builds the preview from the pull request via the
# GitHub integration, which is the only reason Vercel was chosen over Pages.
#
# The review branch accumulates. create-pull-request was the obvious action for
# this and is deliberately not used: it rebases its branch onto the base on
# every run, so a review left unmerged over a weekend would lose its claims,
# orphan the outstanding batch and pay to extract the corpus a second time.
# Driving git directly is a few more lines and no guessed semantics.
#
# Action SHAs are pinned, not tagged: a tag is mutable and this repository
# publishes under an institution's name. The version each was resolved from is
# in the comment beside it.
name: daily

on:
  schedule:
    # 05:17 UTC — 07:17 in Paris in summer, 06:17 in winter, so the claims are
    # waiting before the morning review. An odd minute on purpose: the top of
    # the hour is when every cron on GitHub fires at once and queues.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two writers on one SQLite file cost about forty minutes once already, and
# PRAGMA integrity_check reported "ok" afterwards — that is a statement about
# file structure, not about logical state. Runs do not overlap.
concurrency:
  group: daily
  cancel-in-progress: false

env:
  REVIEW_BRANCH: daily

jobs:
  morning:
    # Pinned, like the action SHAs above: GitHub warns that ubuntu-latest
    # moves to Ubuntu 26 on 2026-10-19, and an image changing underneath a
    # daily job during an election is the kind of surprise this repository
    # spends effort avoiding. Move it deliberately, after a green run.
    runs-on: ubuntu-24.04
    # OPENAI_API_KEY lives in this environment, not in the repository's
    # secrets. Without naming it here the secret resolves to empty and the
    # extraction steps fail on a missing credential. Checked: no protection
    # rules and no branch policy, so a scheduled run is not held for approval.
    environment: prd
    env:
      # Job-level because the `secrets` context is not available in a step's
      # `if:` — checked against the contexts table, not assumed. Written as a
      # secret straight into the condition, the healthcheck step would never
      # run, which is a silently dead dead-man's switch.
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The review branch accumulates DATA, never code.
      #
      # Checking the branch out wholesale would run whatever code it was
      # branched from: a review left open for a week would still be running
      # last week's fetchers, and a fix merged to main in the meantime would
      # not reach the job that needs it. So the code always comes from main,
      # and only data/ is restored from the open review — which is where
      # yesterday's claims, the outstanding batch and the dedup history live,
      # including any correction an editor made in the pull request.
      #
      # Restoring rather than merging is deliberate: a squash merge leaves the
      # branch with no common ancestor, and merging main back in would then
      # conflict on every file.
      - name: Continue the open review, or start a new one
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$REVIEW_BRANCH" origin/main
          if [ -n "$(gh pr list --head "$REVIEW_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "continuing the open review: code from main, data from the branch"
            git checkout "origin/$REVIEW_BRANCH" -- data/
          else
            echo "no review open; starting fresh from main"
          fi

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # --frozen: install exactly what uv.lock pins and fail if it is stale.
      # A morning that silently resolved different transitive versions from the
      # ones reviewed is not the build anybody approved.
      - name: Install
        run: |
          uv sync --frozen --all-extras --group dev
          uv tool install yt-dlp      # CLI dependency of the video fetcher

      # Yesterday's batch first. A batch is never waited on: if it is still
      # running this is a no-op and tomorrow collects it.
      - name: Collect yesterday's batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m observatoire.extract collect

      # A source that returned nothing three runs running exits non-zero here.
      # That must not discard the morning's work, so it is recorded and
      # reported at the end instead of stopping the job.
      - name: Fetch
        id: fetch
        continue-on-error: true
        run: uv run python -m observatoire.fetch

      # Non-fatal for the same reason as fetch and the gates, and it was
      # learned the hard way: this step failed on "billing hard limit has been
      # reached" after Fetch had spent fourteen minutes taking Wayback
      # snapshots of 180 documents, and because the job stopped here the
      # commit never ran and all of it was discarded. Submitting is the step
      # most likely to fail for reasons outside this repository — an account
      # limit, a provider outage — and none of those are a reason to throw
      # away the morning's fetching. The chunks stay queued for tomorrow.
      - name: Submit today's batch
        id: submit
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m observatoire.extract submit

      # Same reasoning as the fetch step: a failing gate must reach a human as
      # a diff they can fix, not as a job that vanished. The red check is what
      # blocks the merge — which needs branch protection on main to mean
      # anything. See README § Before launch.
      # --check-links only here: it needs network, which the pull-request gate
      # deliberately does not have. A source the candidate has deleted warns
      # rather than fails, because the archived capture still answers and
      # stopping publication over that would teach an editor to override the
      # gates. It turns fatal only when nothing stands behind the quote.
      - name: Quality gates
        id: gates
        continue-on-error: true
        run: uv run python -m observatoire.lint --check-links

      # Proves the site still builds. What ships is built by Vercel from the
      # pull request; site/ is gitignored and is not committed here.
      - name: Render
        run: uv run python -m observatoire.render

      - name: Commit the morning and open the review
        run: |
          # -A over the whole directory rather than three pathspecs: on the
          # first run data/artifacts does not exist yet, and a missing
          # pathspec is a fatal error. data/ holds only claims, the database
          # and provenance; site/ is ignored.
          git add -A data/
          if git diff --cached --quiet; then
            echo "nothing changed this morning"
            exit 0
          fi
          git commit -m "Morning pass: claims, provenance artifacts, pipeline state"
          # Forced because the branch is rebuilt on main every run. The lease
          # is what makes it safe: if someone pushed to the review since this
          # job fetched, the push is refused rather than silently discarding
          # their work, and re-running the job picks their commit up.
          git push --force-with-lease origin "$REVIEW_BRANCH"
          if [ -n "$(gh pr list --head "$REVIEW_BRANCH" --state open --json number --jq '.[].number')" ]; then
            exit 0
          fi
          # Best-effort, and deliberately not fatal. Opening this needs
          # "Allow GitHub Actions to create and approve pull requests", which
          # also lets a workflow *approve* one — and a human approving each
          # morning is the whole editorial premise. The work is already pushed
          # above, so the cost of leaving that setting off is one click on the
          # branch banner, not a lost morning.
          gh pr create --base main --head "$REVIEW_BRANCH" \
            --title "Revue du matin" --body-file .github/review-body.md \
            || echo "::warning::Could not open the pull request. The branch '$REVIEW_BRANCH' is pushed and carries the morning's work — open the review by hand."

      # The dead-man's switch. GitHub sends no notification when a scheduled
      # workflow silently stops, so absence of this ping is the alert — the
      # same failure shape as nosdeputes.fr serving HTTP 200 and an empty
      # array indefinitely. Skipped until the secret exists.
      - name: Ping the healthcheck
        if: env.HEALTHCHECK_URL != ''
        run: curl -fsS --retry 3 --max-time 10 "$HEALTHCHECK_URL"

      # Last, so everything above has already been preserved on the branch.
      - name: Report what went wrong
        if: steps.fetch.outcome == 'failure' || steps.gates.outcome == 'failure' || steps.submit.outcome == 'failure'
        run: |
          echo "fetch:  ${{ steps.fetch.outcome }} — non-zero means a source has returned nothing three runs running"
          echo "submit: ${{ steps.submit.outcome }} — non-zero means the batch was not accepted; the morning is still saved above"
          echo "gates:  ${{ steps.gates.outcome }} — non-zero means a claim failed a gate; the log above names it"
          exit 1
